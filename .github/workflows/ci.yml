name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  test-and-build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXTJS_ENV: test
      JWT_SESSION_SECRET: ci-secret-change-me-before-production-123456789
      NEXT_PUBLIC_SITE_NAME: TypeShift Station
      NEXT_PUBLIC_SITE_URL: https://ci.typeshift.example
      NEXT_PUBLIC_CONTROLLER_NAME: TypeShift CI Entity
      NEXT_PUBLIC_CONTACT_EMAIL: privacy-ci@typeshift.example
      NEXT_PUBLIC_CONTACT_ADDRESS: CI Address Placeholder
      NEXT_PUBLIC_SUPPORT_EMAIL: support-ci@typeshift.example
      NEXT_PUBLIC_DPO_EMAIL: dpo-ci@typeshift.example
      NEXT_PUBLIC_LEGAL_LAST_UPDATED: March 8, 2026
      NEXT_PUBLIC_SCORE_RETENTION_DAYS: "365"
      NEXT_PUBLIC_TELEMETRY_RETENTION_DAYS: "30"
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      NEXT_PUBLIC_SOCIAL_LIVE_ENABLED: "true"
      NEXT_PUBLIC_CLOUDFLARE_ONLY: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Check deployment authorization regressions
        run: |
          python3 .github/scripts/test_deploy_ci_proof.py
          node --test .github/scripts/guarded_deploy.test.mjs

      - name: Install dependencies
        run: npm ci

      - name: Create CI Wrangler config
        run: cp client/wrangler.example.jsonc client/wrangler.jsonc

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run tests
        run: npm run test:coverage
      - name: Preserve typeshift-client coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-typeshift-client
          path: client/coverage/lcov.info
          if-no-files-found: error
          retention-days: 7
      - name: Upload typeshift-client coverage to Codecov
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CODECOV_UPLOAD_ENABLED == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: false
          files: ./client/coverage/lcov.info
          disable_search: true
          fail_ci_if_error: true
          version: v11.3.1
          cleanup: true

      - name: Build worker bundle
        run: npm run build
