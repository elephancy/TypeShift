name: Ops provider reconcile

on:
  workflow_dispatch:
  schedule:
    - cron: '37 * * * *'
  pull_request:
    paths:
      - scripts/ops-cloudflare*.mjs
      - .github/workflows/ops-provider-*.yml

permissions:
  contents: read

concurrency:
  group: ops-provider-reconcile-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: node --test scripts/ops-cloudflare*.test.mjs

  reconcile:
    needs: safety
    if: github.event_name != 'pull_request' && github.repository == 'elephancy/TypeShift' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      OPS_CLOUDFLARE_API_TOKEN: ${{ secrets.OPS_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OPS_LOG_INGESTION_SEED: ${{ secrets.OPS_LOG_INGESTION_SEED }}
      OPS_ARTIFACT_DIR: ${{ runner.temp }}/ops-provider-manifest
    steps:
      - name: Check out reviewed main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Prepare sanitized inventory and source-key hashes
        run: node scripts/ops-cloudflare-reconcile.mjs plan
      - name: Publish hash manifest for the trusted host reconciler
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ops-cloudflare-ingestion-manifest
          path: ${{ runner.temp }}/ops-provider-manifest/*.json
          if-no-files-found: error
          retention-days: 7
      - name: Reconcile native Worker export and verify provider readback
        run: node scripts/ops-cloudflare-reconcile.mjs enroll
