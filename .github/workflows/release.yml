name: Deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches:
      - main

concurrency:
  group: workflow-${{ github.workflow }}-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy-cloudflare:
    if: github.repository == 'elephancy/TypeShift' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      CF_D1_DATABASE_ID: ${{ vars.CF_D1_DATABASE_ID }}
      CF_CACHE_KV_ID: ${{ vars.CF_CACHE_KV_ID }}
      CF_RATE_LIMIT_KV_ID: ${{ vars.CF_RATE_LIMIT_KV_ID }}
      NEXTJS_ENV: production
      JWT_SESSION_SECRET: build-time-placeholder-change-me
      NEXT_PUBLIC_SITE_NAME: ${{ vars.NEXT_PUBLIC_SITE_NAME }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_CONTROLLER_NAME: ${{ vars.NEXT_PUBLIC_CONTROLLER_NAME }}
      NEXT_PUBLIC_CONTACT_EMAIL: ${{ vars.NEXT_PUBLIC_CONTACT_EMAIL }}
      NEXT_PUBLIC_CONTACT_ADDRESS: ${{ vars.NEXT_PUBLIC_CONTACT_ADDRESS }}
      NEXT_PUBLIC_SUPPORT_EMAIL: ${{ vars.NEXT_PUBLIC_SUPPORT_EMAIL }}
      NEXT_PUBLIC_DPO_EMAIL: ${{ vars.NEXT_PUBLIC_DPO_EMAIL }}
      NEXT_PUBLIC_LEGAL_LAST_UPDATED: ${{ vars.NEXT_PUBLIC_LEGAL_LAST_UPDATED }}
      NEXT_PUBLIC_SCORE_RETENTION_DAYS: ${{ vars.NEXT_PUBLIC_SCORE_RETENTION_DAYS }}
      NEXT_PUBLIC_TELEMETRY_RETENTION_DAYS: ${{ vars.NEXT_PUBLIC_TELEMETRY_RETENTION_DAYS }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      NEXT_PUBLIC_ADMIN_HANDLES: ${{ vars.NEXT_PUBLIC_ADMIN_HANDLES }}
      NEXT_PUBLIC_SOCIAL_LIVE_ENABLED: "true"
      NEXT_PUBLIC_CLOUDFLARE_ONLY: "true"

    steps:
      - name: Authorize deployment source before checkout
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_EVENT: ${{ github.event_name }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
          CI_TRIGGER: ${{ toJSON(github.event.workflow_run) }}
          WORKFLOW_SOURCE_SHA: ${{ github.workflow_sha }}
        run: |
          python3 -I - <<'PY'
          import base64, hashlib, json, os, pathlib, re, runpy, sys, tempfile
          from urllib.request import HTTPRedirectHandler, Request, build_opener
          repository = os.environ['SOURCE_REPOSITORY']
          revision = os.environ['WORKFLOW_SOURCE_SHA']
          if repository != 'elephancy/TypeShift' or not re.fullmatch(r'[a-f0-9]{40}', revision):
              raise SystemExit('Unexpected deployment policy identity')
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, *args):
                  raise RuntimeError('Policy source redirect refused')
          policy_root = pathlib.Path(tempfile.mkdtemp(prefix='typeshift-ci-policy-', dir=os.environ['RUNNER_TEMP']))
          opener = build_opener(NoRedirect)
          for filename in ('deploy_ci_proof.py', 'guarded_deploy.mjs'):
              url = f'https://api.github.com/repos/{repository}/contents/.github/scripts/{filename}?ref={revision}'
              request = Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              with opener.open(request, timeout=20) as response:
                  data = response.read(2 * 1024 * 1024 + 1)
                  if response.status != 200 or len(data) > 2 * 1024 * 1024:
                      raise SystemExit('Deployment policy source is unavailable')
                  blob = json.loads(data)
              if blob.get('encoding') != 'base64':
                  raise SystemExit('Deployment policy encoding is invalid')
              source = base64.b64decode(blob['content'].replace('\n', ''), validate=True)
              if not source or len(source) > 128 * 1024 or hashlib.sha1(b'blob ' + str(len(source)).encode() + b'\0' + source).hexdigest() != blob.get('sha'):
                  raise SystemExit('Deployment policy blob is invalid')
              target = policy_root / filename
              with target.open('xb') as handle:
                  handle.write(source)
              target.chmod(0o600)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'policy_root={policy_root}\n')
              output.write('wrapper_sha256=' + hashlib.sha256((policy_root / 'guarded_deploy.mjs').read_bytes()).hexdigest() + '\n')
          sys.argv = [str(policy_root / 'deploy_ci_proof.py'), 'authorize']
          runpy.run_path(sys.argv[0], run_name='__main__')
          PY

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.proof.outputs.source_sha }}

      - name: Verify exact checkout
        env:
          SOURCE_SHA: ${{ steps.proof.outputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Record trusted Node executable
        id: node
        run: echo "binary=$(command -v node)" >> "$GITHUB_OUTPUT"

      - name: Check deployment authorization regressions
        run: |
          python3 .github/scripts/test_deploy_ci_proof.py
          node --test .github/scripts/guarded_deploy.test.mjs

      - name: Install dependencies
        run: npm ci

      - name: Generate production Wrangler config
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const configPath = "client/wrangler.jsonc";
          const baseConfig = fs.existsSync(configPath)
            ? JSON.parse(fs.readFileSync(configPath, "utf8"))
            : {};

          function required(name, fallback) {
            const value = process.env[name];
            if (value) {
              return value;
            }
            if (fallback) {
              return fallback;
            }
            throw new Error(`Missing required GitHub Actions variable or secret: ${name}`);
          }

          function envOrBase(name, fallback) {
            const value = process.env[name];
            if (value) {
              return value;
            }
            if (fallback !== undefined && fallback !== null && fallback !== "") {
              return fallback;
            }
            return "";
          }

          function firstRouteHostname(config) {
            const route = Array.isArray(config.routes) ? config.routes[0] : undefined;
            if (route && typeof route.pattern === "string" && route.pattern.length > 0) {
              return route.pattern;
            }
            return undefined;
          }

          function firstBindingValue(list, key) {
            if (!Array.isArray(list)) {
              return undefined;
            }
            const item = list[0];
            if (!item || typeof item !== "object") {
              return undefined;
            }
            return item[key];
          }

          const baseVars = baseConfig.vars || {};
          const siteUrl =
            envOrBase("NEXT_PUBLIC_SITE_URL", baseVars.NEXT_PUBLIC_SITE_URL) ||
            (firstRouteHostname(baseConfig) ? `https://${firstRouteHostname(baseConfig)}` : "");

          if (!siteUrl) {
            throw new Error("Missing required GitHub Actions variable or secret: NEXT_PUBLIC_SITE_URL");
          }

          const hostname = new URL(siteUrl).hostname;
          const workerName = envOrBase("WORKER_NAME", baseConfig.name || "typeshift");
          const cacheKvId = required(
            "CF_CACHE_KV_ID",
            Array.isArray(baseConfig.kv_namespaces)
              ? baseConfig.kv_namespaces.find((entry) => entry.binding === "CACHE_KV")?.id
              : undefined,
          );
          const rateLimitKvId = required(
            "CF_RATE_LIMIT_KV_ID",
            Array.isArray(baseConfig.kv_namespaces)
              ? baseConfig.kv_namespaces.find((entry) => entry.binding === "RATE_LIMIT_KV")?.id
              : undefined,
          );
          const d1DatabaseId = required(
            "CF_D1_DATABASE_ID",
            Array.isArray(baseConfig.d1_databases)
              ? baseConfig.d1_databases.find((entry) => entry.binding === "DB")?.database_id
              : undefined,
          );
          const nextCacheBucket =
            Array.isArray(baseConfig.r2_buckets)
              ? baseConfig.r2_buckets.find((entry) => entry.binding === "NEXT_INC_CACHE_R2_BUCKET")
                  ?.bucket_name
              : undefined;
          const replayBucket =
            Array.isArray(baseConfig.r2_buckets)
              ? baseConfig.r2_buckets.find((entry) => entry.binding === "REPLAY_BUCKET")?.bucket_name
              : undefined;
          const backupBucket =
            Array.isArray(baseConfig.r2_buckets)
              ? baseConfig.r2_buckets.find((entry) => entry.binding === "BACKUP_BUCKET")?.bucket_name
              : undefined;

          const config = {
            "$schema": "../node_modules/wrangler/config-schema.json",
            name: workerName,
            main: ".open-next/worker.js",
            compatibility_date: baseConfig.compatibility_date || "2026-09-08",
            compatibility_flags:
              baseConfig.compatibility_flags || ["nodejs_compat", "global_fetch_strictly_public"],
            assets: baseConfig.assets || {
              directory: ".open-next/assets",
              binding: "ASSETS",
            },
            services: [
              {
                binding: "WORKER_SELF_REFERENCE",
                service: workerName,
              },
            ],
            vars: {
              NEXTJS_ENV: "production",
              NEXT_PUBLIC_SITE_NAME: envOrBase("NEXT_PUBLIC_SITE_NAME", baseVars.NEXT_PUBLIC_SITE_NAME || "TypeShift"),
              NEXT_PUBLIC_SITE_URL: siteUrl,
              NEXT_PUBLIC_CONTROLLER_NAME: envOrBase("NEXT_PUBLIC_CONTROLLER_NAME", baseVars.NEXT_PUBLIC_CONTROLLER_NAME || "TypeShift"),
              NEXT_PUBLIC_CONTACT_EMAIL: envOrBase("NEXT_PUBLIC_CONTACT_EMAIL", baseVars.NEXT_PUBLIC_CONTACT_EMAIL),
              NEXT_PUBLIC_CONTACT_ADDRESS: envOrBase("NEXT_PUBLIC_CONTACT_ADDRESS", baseVars.NEXT_PUBLIC_CONTACT_ADDRESS),
              NEXT_PUBLIC_SUPPORT_EMAIL: envOrBase("NEXT_PUBLIC_SUPPORT_EMAIL", baseVars.NEXT_PUBLIC_SUPPORT_EMAIL),
              NEXT_PUBLIC_DPO_EMAIL: envOrBase("NEXT_PUBLIC_DPO_EMAIL", baseVars.NEXT_PUBLIC_DPO_EMAIL),
              NEXT_PUBLIC_LEGAL_LAST_UPDATED: envOrBase("NEXT_PUBLIC_LEGAL_LAST_UPDATED", baseVars.NEXT_PUBLIC_LEGAL_LAST_UPDATED || "March 8, 2026"),
              NEXT_PUBLIC_SCORE_RETENTION_DAYS: envOrBase("NEXT_PUBLIC_SCORE_RETENTION_DAYS", baseVars.NEXT_PUBLIC_SCORE_RETENTION_DAYS || "365"),
              NEXT_PUBLIC_TELEMETRY_RETENTION_DAYS: envOrBase("NEXT_PUBLIC_TELEMETRY_RETENTION_DAYS", baseVars.NEXT_PUBLIC_TELEMETRY_RETENTION_DAYS || "30"),
              NEXT_PUBLIC_TURNSTILE_SITE_KEY: required("NEXT_PUBLIC_TURNSTILE_SITE_KEY", baseVars.NEXT_PUBLIC_TURNSTILE_SITE_KEY),
              NEXT_PUBLIC_ADMIN_HANDLES: envOrBase("NEXT_PUBLIC_ADMIN_HANDLES", baseVars.NEXT_PUBLIC_ADMIN_HANDLES),
              NEXT_PUBLIC_SOCIAL_LIVE_ENABLED: envOrBase("NEXT_PUBLIC_SOCIAL_LIVE_ENABLED", baseVars.NEXT_PUBLIC_SOCIAL_LIVE_ENABLED || "true"),
              NEXT_PUBLIC_CLOUDFLARE_ONLY: "true",
            },
            routes: [
              {
                pattern: hostname,
                custom_domain: true,
              },
            ],
            d1_databases: [
              {
                binding: "DB",
                database_name: "typeshift-prod",
                database_id: d1DatabaseId,
                remote: true,
              },
            ],
            kv_namespaces: [
              {
                binding: "CACHE_KV",
                id: cacheKvId,
              },
              {
                binding: "RATE_LIMIT_KV",
                id: rateLimitKvId,
                remote: true,
              },
            ],
            analytics_engine_datasets: baseConfig.analytics_engine_datasets || [
              {
                binding: "USAGE_ANALYTICS",
                dataset: "typeshift_usage",
              },
            ],
            r2_buckets: [
              {
                bucket_name: nextCacheBucket || "typeshift-next-cache",
                binding: "NEXT_INC_CACHE_R2_BUCKET",
                remote: true,
              },
              {
                bucket_name: replayBucket || "typeshift-replays",
                binding: "REPLAY_BUCKET",
                remote: true,
              },
              {
                bucket_name: backupBucket || "typeshift-backups",
                binding: "BACKUP_BUCKET",
                remote: true,
              },
            ],
          };

          fs.writeFileSync(configPath, `${JSON.stringify(config, null, 2)}\n`);
          NODE

      - name: Audit dependencies
        if: steps.proof.outputs.reuse_ci != 'true'
        run: npm audit --audit-level=high

      - name: Run tests
        if: steps.proof.outputs.reuse_ci != 'true'
        run: npm run test

      - name: Prepare the production worker build
        run: npm --prefix client run clean:worker

      - name: Revalidate before production credentials
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_EVENT: ${{ github.event_name }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
          CI_TRIGGER: ${{ toJSON(github.event.workflow_run) }}
          EXPECTED_PROOF: ${{ steps.proof.outputs.proof }}
          EXPECTED_HELPER_SHA256: ${{ steps.proof.outputs.helper_sha256 }}
          CI_POLICY_ROOT: ${{ steps.proof.outputs.policy_root }}
        run: |
          /usr/bin/python3 -I - <<'PY'
          import hashlib, os, pathlib, runpy, sys
          helper = pathlib.Path(os.environ['CI_POLICY_ROOT']) / 'deploy_ci_proof.py'
          if hashlib.sha256(helper.read_bytes()).hexdigest() != os.environ['EXPECTED_HELPER_SHA256']:
              raise SystemExit('Deployment policy changed after checkout')
          sys.argv = [str(helper), 'revalidate']
          runpy.run_path(str(helper), run_name='__main__')
          PY

      - name: Apply D1 schema, build and deploy through guarded central Ops
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_EVENT: ${{ github.event_name }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
          CI_TRIGGER: ${{ toJSON(github.event.workflow_run) }}
          EXPECTED_PROOF: ${{ steps.proof.outputs.proof }}
          EXPECTED_HELPER_SHA256: ${{ steps.proof.outputs.helper_sha256 }}
          EXPECTED_WRAPPER_SHA256: ${{ steps.proof.outputs.wrapper_sha256 }}
          CI_POLICY_ROOT: ${{ steps.proof.outputs.policy_root }}
          TRUSTED_NODE: ${{ steps.node.outputs.binary }}
          NODE_OPTIONS: ""
          NODE_PATH: ""
        run: |
          /usr/bin/python3 -I - <<'PY'
          import hashlib, os, pathlib, subprocess
          wrapper = pathlib.Path(os.environ['CI_POLICY_ROOT']) / 'guarded_deploy.mjs'
          if hashlib.sha256(wrapper.read_bytes()).hexdigest() != os.environ['EXPECTED_WRAPPER_SHA256']:
              raise SystemExit('Deployment wrapper changed after checkout')
          node = os.environ['TRUSTED_NODE']
          if not pathlib.Path(node).is_absolute():
              raise SystemExit('Trusted Node executable is missing')
          subprocess.run([node, str(wrapper)], check=True)
          PY
