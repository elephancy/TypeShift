name: Cloudflare Backup

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

jobs:
  export-d1-to-r2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_D1_DATABASE_ID: ${{ vars.CF_D1_DATABASE_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate backup Wrangler config
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const databaseId = process.env.CF_D1_DATABASE_ID;
          if (!databaseId) {
            throw new Error("Missing required production variable: CF_D1_DATABASE_ID");
          }

          const config = {
            "$schema": "../node_modules/wrangler/config-schema.json",
            name: "typeshift-backup",
            compatibility_date: "2026-09-08",
            d1_databases: [
              {
                binding: "DB",
                database_name: "typeshift-prod",
                database_id: databaseId,
                remote: true,
              },
            ],
          };

          fs.writeFileSync(
            "client/wrangler.backup.jsonc",
            `${JSON.stringify(config, null, 2)}\n`,
          );
          NODE

      - name: Export D1 database
        run: |
          mkdir -p backups
          BACKUP_NAME="typeshift-$(date -u +%F-%H%M%S).sql"
          BACKUP_FILE="backups/${BACKUP_NAME}"
          npx wrangler d1 export typeshift-prod --config client/wrangler.backup.jsonc --remote --output "${BACKUP_FILE}"
          npx wrangler r2 object put "typeshift-backups/${BACKUP_NAME}" --remote --file "${BACKUP_FILE}"

      - name: Upload backup artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: d1-backup
          path: backups/*.sql
