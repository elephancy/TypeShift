name: Ops provider enroll

on:
  workflow_run:
    workflows: ['Ops provider reconcile']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      plan_run_id:
        description: Successful main-branch Ops provider reconcile run ID
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ops-provider-enroll
  cancel-in-progress: false

jobs:
  enroll:
    if: >-
      github.repository == 'elephancy/TypeShift' &&
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' ||
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == 'elephancy/TypeShift' &&
       contains(fromJSON('["workflow_dispatch","schedule"]'), github.event.workflow_run.event))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Validate immutable reviewed plan before checkout or credentials
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_RUN_ID: ${{ github.event.workflow_run.id || inputs.plan_run_id }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFile } from 'node:fs/promises';
          const id = process.env.PLAN_RUN_ID;
          if (!/^\d+$/.test(id)) throw new Error('Invalid plan run ID');
          async function get(path) {
            const response = await fetch(`https://api.github.com/repos/elephancy/TypeShift/${path}`, {
              headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json' },
              redirect: 'error', signal: AbortSignal.timeout(30000),
            });
            if (!response.ok) throw new Error(`Plan verification HTTP ${response.status}`);
            return response.json();
          }
          const run = await get(`actions/runs/${id}`);
          const main = await get('commits/main');
          if (run.path !== '.github/workflows/ops-provider-reconcile.yml' ||
              run.conclusion !== 'success' || run.head_branch !== 'main' ||
              run.head_repository?.full_name !== 'elephancy/TypeShift' ||
              !['workflow_dispatch', 'schedule'].includes(run.event) || run.head_sha !== main.sha) {
            throw new Error('Plan is not a successful current reviewed-main reconciliation');
          }
          await appendFile(process.env.GITHUB_OUTPUT, `sha=${run.head_sha}\nrun_id=${id}\n`);
          NODE
      - name: Check out exact verified plan source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Download the immutable hash-only plan artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ops-cloudflare-ingestion-manifest
          path: ${{ runner.temp }}/ops-provider-manifest
          run-id: ${{ steps.plan.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Await host acceptance, enroll native exports and verify readback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPS_CLOUDFLARE_API_TOKEN: ${{ secrets.OPS_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPS_LOG_INGESTION_SEED: ${{ secrets.OPS_LOG_INGESTION_SEED }}
          OPS_ARTIFACT_DIR: ${{ runner.temp }}/ops-provider-manifest
        run: node scripts/ops-cloudflare-reconcile.mjs enroll
